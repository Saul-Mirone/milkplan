pre-commit:
  commands:
    oxlint:
      priority: 1
      glob: '*.{ts,tsx,mts,cts,mjs,cjs,js,jsx}'
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true
    oxfmt:
      priority: 2
      glob: '*.{ts,tsx,mts,cts,mjs,cjs,js,jsx,json,jsonc,md,mdx,yml,yaml,css}'
      # --no-error-on-unmatched-pattern: .changeset/ is ignored by .oxfmtrc.json
      # (oxfmt would rewrite changeset frontmatter), and lefthook passes staged
      # files explicitly — without this, a changeset-only commit fails here.
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
