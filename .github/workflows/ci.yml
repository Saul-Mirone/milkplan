name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      # dist/ is gitignored and the e2e suite drives the built CLI, so the
      # build has to run before the tests — and a broken build is otherwise
      # invisible until someone publishes.
      - run: pnpm run build
      - run: pnpm run test
